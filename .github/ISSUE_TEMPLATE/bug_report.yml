name: Bug 报告
description: 如果你在使用过程中遇到了问题且未被其他issue提及，请提交一个 Bug 报告，我们会尽快调查并修复这个问题。
title: "[Bug] 请输入标题"
assignees: Hengxiaopi
labels:
  - "Bug"
body:
- type: textarea
  id: description
  validations:
    required: true
  attributes:
     label: Bug 描述
     description: 请简短的描述你遇到的问题

- type: textarea
  id: repro-steps
  validations:
    required: true
  attributes:
     label: 复现问题的步骤
     render: markdown
     description: 请提供复现问题的步骤，如果不能，请写明原因
     placeholder: |
        干净清晰的复现步骤有助于开发者更快定位问题所在，你所遇到的问题也会获得更高的优先级.

        示例步骤:
        1. 打开应用
        2. 进入 '...'
        3. 点击 '....'
        4. 滚动至 '....'
        5. 发现问题

- type: textarea
  id: screenshots
  attributes:
     label: 截图
     description: 如果可以，提交截图更有助于我们分析问题
     placeholder: 将截图复制后直接粘贴到这里

- type: textarea
  id: log-info
  attributes:
     label: 日志记录
     description: 请在软件首页点击`复制日志内容`按钮，复制日志内容后粘贴到这里

- type: textarea
  id: additional-context
  attributes:
     label: 备注
     description: 添加你认为必要的其他信息
     render: markdown