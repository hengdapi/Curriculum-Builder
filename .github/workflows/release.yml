name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. 检出代码 ──────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于 changelog 生成

      # ── 2. 设置 Python ──────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. 安装依赖 ──────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      # ── 4. 提取版本号 ────────────────────────────────
      - name: Extract version info
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      # ── 5. Nuitka 编译 (文件夹版) ────────────────────
      - name: Build with Nuitka (standalone folder)
        shell: pwsh
        run: |
          # deploy.py 已包含完整的 Nuitka 参数
          python deploy.py
          # 验证输出
          if (Test-Path "main.dist\main.exe") {
            Write-Output "✓ Nuitka build succeeded"
          } else {
            Write-Output "✗ main.exe not found, checking directory..."
            Get-ChildItem -Recurse -Name main.dist
            exit 1
          }

      # ── 6. 生成 Inno Setup 脚本并编译安装包 ─────────
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Generate Inno Setup script & compile installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python ci\generate_iss.py
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup 6" -Filter "ISCC.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Output "Using ISCC: $iscc"
          & $iscc installer.iss

      # ── 7. 创建便携版 ZIP ────────────────────────────
      - name: Create portable ZIP archive
        shell: pwsh
        run: |
          $zipName = "School-Timetable-Generator-v$env:APP_VERSION-Windows-x86_64.zip"
          Compress-Archive -Path "main.dist\*" -DestinationPath $zipName
          Write-Output "Created: $zipName"
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      # ── 8. 自动生成 Changelog ────────────────────────
      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $prev_tag = git describe --tags --abbrev=0 HEAD~1 2>$null
          if (-not $prev_tag) {
            # 首个 tag：取全部历史
            $commits = git log --pretty=format:"* %s (%h)" --no-merges
          } else {
            $commits = git log --pretty=format:"* %s (%h)" --no-merges "$prev_tag..HEAD"
          }
          if ([string]::IsNullOrWhiteSpace($commits)) {
            $commits = "* 发布 ${{ steps.version.outputs.tag }}"
          }
          # 写入文件避免特殊字符转义问题
          $commits | Out-File -FilePath changelog.md -Encoding UTF8
          echo "changelog_file=changelog.md" >> $env:GITHUB_OUTPUT

      # ── 9. 发布到 GitHub Release 草稿箱 ──────────────
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: changelog.md
          files: |
            School-Timetable-Generator-v${{ steps.version.outputs.version }}-Windows-x86_64.zip
            School-Timetable-Generator-v${{ steps.version.outputs.version }}-Windows-x86_64-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
